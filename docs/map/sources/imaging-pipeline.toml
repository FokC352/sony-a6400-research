[[claim]]
id = "C01"
entities = ["img.cc-lut"]
status = "verified-offline"
text = "av-cam.bin applies a CC: 3D LUT (5x9x9 YCbCr), a 3x3 Q10 color matrix and EC_Gamma (96 x uint16) before the 8-bit stage."
