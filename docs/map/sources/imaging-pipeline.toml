[[frontier]]
id = "F01"
title = "From RCRAW enable to an actual RAW/high-bit-depth recording"
state = "open"
entities = ["img.rcraw", "img.recording-paths"]
evidence = ["E0634", "E0635", "E0621"]
next = "RCRAW_EN persists, but no RAW or >8-bit recording is produced yet; the external-output gate and AIF write paths remain to be qualified on hardware."

[[hazard]]
id = "H01"
title = "Color matrix RAM patches persist"
effect = "The a6400 color matrix table at 0x6444a044 is saved to /setting/Backup.* on power-off, so RAM patches become persistent."
rule = "Restore original matrix values before power-off unless a persistent change is intended and authorized."
evidence = ["E0555"]
