summary = "av-cam's CC: 3D LUT (5x9x9 YCbCr), 3x3 Q10 color matrix and EC_Gamma (96 x uint16) applied before 8-bit output."

[[entity]]
id = "mod.arrivederci"
kind = "module"
name = "Arrivederci color mod"
summary = "RAM-only color mod using a matrix fitted to the official ARRI Classic LUT; CC+8 is refilled every frame."

[[entity]]
