[[claim]]
id = "C19"
entities = ["img.sele-refresh", "img.sgc-timing", "img.fe-rcv", "img.recording-paths"]
status = "refuted"
superseded_by = "C21"
text = "plus24 raises the 66 FE halfwords, V_ACTIVE, and the six rcv halfwords and arms the S-Ele latch; shrink, test1, and timing4 do not. The latch source is Lost CAMOUT_V or a CamCore error. The SGC H/V words that become hvcycle are not in the static patch, so a mode re-entry may keep the stock vertical period under the taller FE frame. Which latch source fired, and whether those BSS words stayed stock, is not proven offline."
evidence = ["E0696", "E0697"]

[[claim]]
id = "C20"
entities = ["img.camout-v-check", "img.sele-refresh"]
status = "verified-offline"
text = "Lost CAMOUT_V is a frame-commit consistency watchdog, not a geometry compare. 0x63907D00 is called only from 0x6393275E and logs 0x63F2B2E3 at 0x63907E66, then sets latch 0x644B02B9 at 0x63907E6A via helper 0x63907B74 (pool 0x00BA873D). The emit condition is p[0] == ((*(0x643679A8)+1) & 0xFFFFFF) and *(0x643679DC) != p[0] and imaging->byte[0x514] == 0. No immediate in the function is a vertical size, and a whole-image immediate sweep finds no compare against 3376/3392/3396/3400/3416/3442/3445/3447/3456/3480. The only true video-height compare is cmp.w #0x870 (2160)."
evidence = ["E0698"]

[[claim]]
id = "C21"
entities = ["img.camout-v-check", "img.fe-rcv", "img.recording-paths"]
status = "verified-physical"
text = "The open-gate vertical ceiling is direction-only, not a line budget. Re-derived FE maximum vertical halfword (+0x190) and rcv_b_vtot per case: stock 3445/3447 margin 35 PASS, shrink 3285/3287 margin 195 PASS, test1 3445/3447 margin 35 PASS, timing4 3445/3447 margin 195 PASS, plus24 3469/3471 margin 11 FAIL, test4 3605/3607 margin 35 FAIL. test4 leaves the same 35-line margin as stock against 2x1820=3640 and still loses CAMOUT_V, so the 3480 budget theory is refuted. Every upward move of the FE/RCV set fails, the equal downward move passes, and sensor-only or timing-only moves pass. FE_max minus sensor Y_SIZE is 49 in every case where both move together."
evidence = ["E0696", "E0698"]

[[claim]]
id = "C22"
entities = ["img.imx284-window", "img.recording-paths"]
status = "verified-offline"
text = "IMX284 is exonerated for plus24. In the 125-row reglist, column 11 differs from column 10 in exactly rows 10-13 (0x000A-0x000D); no register encodes a line count, VMAX, crop height, MIPI Y_OUT_SIZE, EBD position, or SLVS packet count; the applicator 0x6379D618 is a bare strb. Stock column 11 already ends at row 3738, above 3480, and test1 puts Y_SIZE 4020 through the same four bytes and passes. 3480 is 2x1740, the host vertical period of timing_rom_ntsc[16]/[17] at 0x63E2598C/0x63E259A4, not a sensor clamp."
evidence = ["E0698"]

[[claim]]
id = "C23"
entities = ["img.fe-rcv", "img.recording-paths"]
status = "verified-offline"
text = "The FE records are lists of 20-byte crop rectangles, and the first halfword of every pair is horizontal, not a height: fe_rec_0a +0x14 3016 pairs with rcv 0x63E19752 6032, +0x264 3012 pairs with 0x63E197AE 6024, and 0x63E1979C is 6000. 0x63CCBFD0 adds its 2928 delta to horizontal outputs only. Therefore +0x028 3096, +0x252/+0x256 1506 and +0x264 3012 are not unpatched heights, and +0x2C8/+0x2CE are dy-independent scalars. The selector is 0x63771C78 over a 16-record table at 0x63E12F14, stride 0x540; key 0x1F/0x89 with variant 0x0A/0x19 returns 0x63E14E94/0x63E15E54."
evidence = ["E0698"]

[[claim]]
id = "C24"
entities = ["img.fe-rcv", "img.recording-paths"]
status = "verified-offline"
text = "The 66-offset FE set covers every vertical halfword in both records; every unpatched non-zero halfword is horizontal, a delta, a mask, or a sentinel. The FE consumer module 0x63CC0000-0x63CE8000 resolves no literal at or above 0xE0000000, and the only device base on that chain is 0xF3120000. No 0xF300xxxx or 0xF301xxxx write with record-derived data exists in a literal-resolved path; a computed 0xF3xxxxxx plus field address inside 0x63CD3xxx is not excluded."
evidence = ["E0698"]

[[claim]]
id = "C25"
entities = ["img.fe-rcv", "img.runtime-imaging-object"]
status = "verified-offline"
text = "The rcv_desc unit at 0x63E19720 (0xC0 bytes, next unit 0x63E197E0) holds 3396/3392/3376/3447 plus their horizontal partners 6032/6048/6000/6024 and margins 52/48/10/16/2/4. Three independent searches found zero references to the block or its fields: no PC-relative materialisation, no absolute u32 pointer, no resolved literal. It is reached only as base plus index, so the six rcv_desc writes in the 158-entry table have no proven consumer."
evidence = ["E0698"]

[[claim]]
id = "C26"
entities = ["img.size-rows", "img.runtime-imaging-object", "img.sgc-timing"]
status = "refuted"
superseded_by = "C43"
text = "size_rows is 19 records at 0x63E24F70 with stride 0x4C; records 16 and 17 are byte-identical (+0x1C 6000, +0x24 20, +0x3C 3376). The only static consumer 0x63CF0018 copies fields verbatim into rt_t14 with no arithmetic, compare, or clamp. rt_t14 0x6420128C, rt_t10 0x64200EFC and the mode object 0x64200A48 occur once each, as slots of the pointer table at 0x645C1798, and are registered at runtime through 0x63AC209C and 0x63CEF540; no reference of any kind to rt_t14, rt_t10, rt_t18 or rt_t1c exists elsewhere in this image. The height lists at 0x6454AB60 (3360..3392, 3472..3488) have no static reader."
evidence = ["E0698"]

[[claim]]
id = "C27"
entities = ["img.camout-v-check", "img.sgc-timing", "img.fe-rcv"]
status = "refuted"
superseded_by = "C42"
text = "Three explanations survive for the upward-only ceiling and none is separable offline. R1: a consumer compares an FE/RCV vertical total against a stock-valued copy, so dy greater than 0 makes the difference negative or pushes the end edge past the stock bottom, most likely in the unread rcv_desc unit. R2: a buffer or descriptor sized at the stock geometry is overrun by dy greater than 0 and under-filled by dy less than 0. R3: the SGC2 measurement window closes one-sidedly, because the low 14 bits of 0xF3120318 are hardware-measured and 0x6376910C re-derives the limits as measured plus trim, so a guard of the form measured < programmed fails only when the measured vertical position grows."
evidence = ["E0698"]

[[claim]]
id = "C28"
entities = ["img.sele-refresh"]
status = "verified-offline"
text = "refresh_cnt 0x64367AF0 counts S-Ele recovery/restart cycles, not geometry events. 0x6390785A compares it with 10; at 11 or more the body logs 0x63F2B29B FW: S-Ele Refresh ng force exception and executes the deliberate NULL store 0x63907870. plus24 reaching 27 is therefore a restart storm, which is the low-FPS symptom rather than the geometry limit."
evidence = ["E0698"]

[[claim]]
id = "C29"
entities = ["img.sgc-timing", "img.camout-v-check"]
status = "verified-offline"
text = "SGC units are 0xF3120000 and 0xF3121000 with SGC1/SGC2/SGC3 at +0x200/+0x300/+0x400. The only writer of hvcyc 0xF3120220 is 0x63CD46F8 with ((H-1)<<16)|((V>>1)-1), sourced from the SGC1 block +0x38/+0x3C, which 0x638B8CE8 fills from imaging +0x98/+0x9C. 0x6376A9E0 caches five inputs and returns without writing when all five match, so the timing set is event-driven and never per-frame. hq and vq are bits[29:16] and bits[13:0] of 0xF3120318, read only at the log site 0x63907E3C, so they carry no decision. 0xF3120318/0x031C/0x0338 have no software writer, and 0x6376910C re-derives the high-half limits at 0x032C/0x0330/0x0334/0x033C/0x035C as measured plus trim, with the only /8 decimations in the path."
evidence = ["E0698"]

[[claim]]
id = "C30"
entities = ["img.sgc-timing"]
status = "verified-offline"
