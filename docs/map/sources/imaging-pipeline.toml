[[hazard]]
id = "H01"
title = "Color matrix RAM patches persist"
effect = "The a6400 color matrix table at 0x6444a044 is saved to /setting/Backup.* on power-off, so RAM patches become persistent."
rule = "Restore original matrix values before power-off unless a persistent change is intended and authorized."
evidence = ["E0555"]

[[hazard]]
id = "H02"
title = "S-Ele refresh fault store reboots the camera"
effect = "When refresh_counter is above 10 and bit 0x40 of PA 0x0434FD7E is clear, 0x63907870 stores through r7==0 and the camera reboots."
rule = "A live open-gate height test that can arm the S-Ele latch needs the existing noreboot bit set first, and must clear it again before the session ends."
evidence = ["E0696", "E0697"]

[[hazard]]
id = "H03"
title = "Any upward open-gate FE/RCV step loses CAMOUT_V"
effect = "plus24 (+24) and test4 (+160, with lockstep timing) both lost CAMOUT_V and raised refresh_cnt, while shrink (-160), test1 (sensor only) and timing4 (timing only) stayed clean. The ceiling is the stock FE/RCV geometry itself, not the 3480 line budget: test4 kept the stock 35-line margin and still failed."
rule = "Treat dy greater than 0 as unverified until F03 names the stock-valued limit. Do not spend a live run on +160-class steps; bisect from +8 with noreboot set."
evidence = ["E0698"]
