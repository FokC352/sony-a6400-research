[[claim]]
id = "C02"
entities = ["mod.arrivederci", "img.cc-lut"]
status = "verified-physical"
text = "Arrivederci applies without a Color Mode round trip because CC+8 is refilled every frame; it uses a matrix fitted to the official ARRI Classic LUT, and an A/B recording test (C0029 on vs C0030 off) verified it live."
evidence = ["E0555", "E0556", "E0610"]

[[claim]]
id = "C03"
entities = ["img.detail-psf"]
status = "verified-offline"
